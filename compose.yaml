services:
  afterword:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      CET6_DATA_PATH: /app/data/cet6.sqlite
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - afterword-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 160s
volumes:
  afterword-data:
